<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Plan de pagos · Viajes Casal</title>
  <link rel="icon" href="/brand/logo-mark.png">
  <style>
    :root{--navy:#073b66;--teal:#00b8c8;--coral:#ff7959;--gold:#f6b93b;--bg:#f4f7f9;--text:#203342;--muted:#6c7b87;--border:#dce6ea;--ok:#18815d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
    .hero{background:linear-gradient(140deg,#052f52,#075079);color:#fff;padding:26px 18px 70px;text-align:center}
    .hero img{height:58px;background:#fff;border-radius:12px;padding:6px 10px}
    .hero h1{font-size:24px;margin:16px 0 4px}.hero p{margin:0;color:#d4e6ef;font-size:15px}
    main{max-width:620px;margin:-50px auto 40px;padding:0 16px}
    .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 12px 32px rgba(7,59,102,.08);margin-bottom:16px}
    .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
    .sum span{display:block;font-size:12px;color:var(--muted)}.sum b{font-size:19px;color:var(--navy)}.sum .bal b{color:var(--coral)}
    .bar{height:10px;background:#e7eef1;border-radius:9px;overflow:hidden;margin:16px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#058ab6)}
    .muted{color:var(--muted);font-size:13px}
    h2{font-size:17px;color:var(--navy);margin:0 0 12px}
    .row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-top:1px solid var(--border);align-items:center}
    .row:first-of-type{border-top:0}.row b{font-size:15px}.row small{color:var(--muted);font-size:13px}
    .amt{text-align:right;font-weight:bold;font-size:16px}
    .chip{display:inline-block;font-size:11px;font-weight:bold;border-radius:20px;padding:3px 9px;margin-left:6px;vertical-align:middle}
    .chip.ok{background:#e8f7ef;color:var(--ok)}.chip.late{background:#fdecec;color:#b13e3e}.chip.next{background:#fff5d9;color:#916300}.chip.part{background:#e8f8fa;color:#007985}
    .row.done b,.row.done .amt{color:var(--muted)}
    .pay{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--teal),#058ab6);cursor:pointer;text-align:center;text-decoration:none;margin-top:6px}
    .pay:disabled{opacity:.6;cursor:wait}.pay.alt{background:#fff;color:var(--navy);border:1px solid var(--border)}
    .bank div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--border);font-size:14px}.bank div:first-child{border-top:0}
    .bank span{color:var(--muted)}.bank b{text-align:right;word-break:break-all}
    .copy{border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;padding:3px 8px;margin-left:6px;cursor:pointer}
    .note{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}.note.ok{background:#e8f7ef;color:#0f6247}.note.wait{background:#fff5d9;color:#7a5400}.note.err{background:#fdecec;color:#932f2f}
    .done-all{text-align:center;font-size:18px;color:var(--ok);font-weight:bold;padding:8px 0}
    footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <header class="hero">
    <img src="/brand/logo-viajes-bumeran-casal.png" alt="Viajes Casal">
    <h1 id="title">Tu plan de pagos</h1>
    <p id="subtitle">Cargando…</p>
  </header>
  <main id="app"><div class="card"><p class="muted">Cargando tu plan de pagos…</p></div></main>
  <footer id="foot"></footer>
  <script src="/pagar.js?v=tp204"></script>
</body>
</html>
